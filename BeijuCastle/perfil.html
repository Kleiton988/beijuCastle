<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Perfil</title>
  <link rel="stylesheet" href="perfil.css">
</head>
<body>
  <!-- Botão voltar no topo (lado esquerdo) -->
  <button onclick="voltarHome()" class="btn-voltar-topo">⬅ Voltar para Home</button>

  <h2 id="email"></h2>

  <h3>Dados do usuário</h3>
  <input id="nome" placeholder="Nome">
  <input id="telefone" placeholder="Telefone (apenas números)" inputmode="numeric" pattern="[0-9]*" maxlength="11" title="Digite apenas números (DDD + número)">
  <input id="endereco" placeholder="Endereço">
  <button onclick="salvarPerfil()">Salvar</button>

  <h3>📦 Meus Pedidos</h3>
  <div id="pedidos"></div>

  <!-- mensagem -->
  <div id="msg" style="
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #333;
    color: white;
    padding: 10px;
    display: none;
  "></div>

  <script type="module" src="perfil.js"></script>
</body>
</html>
