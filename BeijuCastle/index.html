<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeijúCastle 🫓</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="card">

      <h1>BeijúCastle 🫓</h1>
      <p>Delícias da fazenda direto para você</p>

      <!-- Abas -->
      <div class="abas">
        <button id="abaLogin" class="aba ativa">Login</button>
        <button id="abaCadastro" class="aba">Criar Conta</button>
      </div>

      <!-- Painel Login -->
      <div id="painelLogin">
        <label for="loginEmail">Email:</label>
        <input type="email" id="loginEmail" placeholder="Digite seu email" maxlength="254">

        <label for="loginSenha">Senha:</label>
        <div class="senha-wrapper">
          <input type="password" id="loginSenha" placeholder="Digite sua senha" maxlength="128">
          <span class="toggle-senha" data-alvo="loginSenha">👁️</span>
        </div>

        <button id="btnLogin">Entrar</button>
        <button id="btnGoogle" class="google-btn">Entrar com Google</button>
        <button id="btnEsqueciSenha" class="link-btn">Esqueci minha senha</button>
      </div>

      <!-- Painel Cadastro -->
      <div id="painelCadastro" style="display:none;">
        <label for="cadastroEmail">Email:</label>
        <input type="email" id="cadastroEmail" placeholder="Digite seu email" maxlength="254">

        <label for="cadastroSenha">Senha:</label>
        <div class="senha-wrapper">
          <input type="password" id="cadastroSenha" placeholder="Crie uma senha" maxlength="128">
          <span class="toggle-senha" data-alvo="cadastroSenha">👁️</span>
        </div>

        <label for="cadastroConfirmarSenha">Confirmar senha:</label>
        <div class="senha-wrapper">
          <input type="password" id="cadastroConfirmarSenha" placeholder="Repita a senha" maxlength="128">
          <span class="toggle-senha" data-alvo="cadastroConfirmarSenha">👁️</span>
        </div>

        <button id="btnCadastro">Cadastrar</button>
      </div>

      <!-- Mensagem de erro/sucesso -->
      <p id="mensagem" style="margin-top:10px; font-size:14px;"></p>

    </div>
  </div>
</body>
</html>
