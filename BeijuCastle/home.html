<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Home - BeijúCastle 🫓</title>
  <link rel="stylesheet" href="home.css">
  <script type="module" src="firebase.js"></script>
  <script type="module" src="home.js" defer></script>
</head>
<body class="home">
  <header class="topo">
    <h1>BeijúCastle 🫓</h1>
    <p id="userEmail"></p>
    <button id="logout">Sair</button>
    <button onclick="irPerfil()">Perfil</button>
    <button id="btnAdmin" style="display:none;" onclick="irAdmin()">Admin</button>
    <!-- Badge do carrinho -->
    <span id="carrinhoBadge" style="display:none;">0</span>
  </header>

  <!-- Categorias -->
  <div class="categorias">
    <button class="cat-btn ativo" data-categoria="todos">Todos</button>
    <button class="cat-btn" data-categoria="tradicional">Tradicional</button>
    <button class="cat-btn" data-categoria="recheado">Recheado</button>
    <button class="cat-btn" data-categoria="doce">Doce</button>
    <button class="cat-btn" data-categoria="especial">Especial</button>
  </div>

  <!-- Busca -->
  <div style="text-align:center; margin-bottom: 15px;">
  <div class="busca-wrapper">
    <input type="text" id="busca" placeholder="Buscar produto..." oninput="aplicarFiltros()">
    <span class="lupa">🔍</span>
    <span id="limparBusca" class="limpar-busca" style="display:none; cursor:pointer;">✕</span>
  </div>
</div>

  <!-- Container principal -->
  <div class="conteudo-principal">
    <main class="cardapio" id="cardapioContainer"></main>

    <aside class="carrinho">
      <h2>⭐ Favoritos</h2>
      <div id="favoritos"></div>
      <button onclick="limparTodos()" style="margin-top:5px;">🗑️ Limpar todos os favoritos</button>

      <h2>🛒 Carrinho</h2>
      <div id="listaCarrinho"></div>
      <button onclick="limparCarrinho()" style="margin-top:5px;">🗑️ Limpar Carrinho</button>

      <div style="margin: 10px 0;">
        <label><input type="radio" name="frete" value="retirada" onchange="alternarFrete('retirada')"> Retirar na loja (grátis)</label>
        <label><input type="radio" name="frete" value="entrega" onchange="alternarFrete('entrega')" checked> Entrega (+ R$ 5,00)</label>
      </div>

      <input type="text" id="cupom" placeholder="Cupom (ex: BEIJU10)">
      <button onclick="aplicarCupom()">Aplicar Cupom</button>
      <button onclick="removerCupom()">Remover Cupom</button>

      <p id="total"></p>
      <button id="btnFinalizar" onclick="iniciarFinalizacao()">Finalizar Pedido</button>
    </aside>
  </div>

  <!-- Modal de pagamento -->
<div id="modalPagamento" class="modal" style="display:none;">
  <div class="modal-content">
    <h2>Finalizar Pagamento</h2>
    <div id="resumoPedido" style="text-align:left; margin-bottom:15px;"></div>
    <p>Escolha a forma de pagamento:</p>
    <select id="formaPagamento">
      <option value="Dinheiro">Dinheiro</option>
      <option value="Cartão de Crédito">Cartão de Crédito</option>
      <option value="Cartão de Débito">Cartão de Débito</option>
      <option value="Pix">Pix</option>
      <option value="Boleto">Boleto Bancário</option>
    </select>
    <br><br>
    <button onclick="confirmarPagamento()">Confirmar Pagamento</button>
    <button onclick="fecharModalPagamento()">Cancelar</button>
  </div>
</div>

  <div id="mensagemSistema" style="position:fixed; bottom:20px; right:20px; background:#333; color:white; padding:12px 18px; border-radius:8px; display:none; z-index:9999;"></div>
</body>
</html>
