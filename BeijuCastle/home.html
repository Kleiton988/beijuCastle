<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Home</title>

  <link rel="stylesheet" href="home.css">

  <script type="module" src="firebase.js"></script>
  <script type="module" src="home.js" defer></script>
</head>

<body class="home">

  <header class="topo">
    <h1>BeijúCastle 🫓</h1>
    <p id="userEmail"></p>
    <button id="logout">Sair</button>
    <button onclick="irPerfil()">Perfil</button>
    <button id="btnAdmin" style="display:none;" onclick="irAdmin()">Admin</button>
  </header>

  <main class="cardapio">

    <div class="item">
      <h2>Beijú Tradicional</h2>
      <span>R$ 5</span>
      <button onclick="addCarrinho('Tradicional', 5)">Adicionar</button>
      <button onclick="toggleFavorito('Tradicional', 5)">⭐</button>
    </div>

    <div class="item">
      <h2>Beijú Queijo</h2>
      <span>R$ 7</span>
      <button onclick="addCarrinho('Queijo', 7)">Adicionar</button>
    </div>

    <div class="item">
      <h2>Beijú Doce</h2>
      <span>R$ 8</span>
      <button onclick="addCarrinho('Doce', 8)">Adicionar</button>
    </div>

  </main>

  <aside class="carrinho">

  <h2>⭐ Favoritos</h2>
  <div id="favoritos"></div>

  <h2>Carrinho</h2>
    

    <div id="listaCarrinho"></div>

    <input type="text" id="cupom" placeholder="Cupom (ex: BEIJU10)">
    <button onclick="aplicarCupom()">Aplicar Cupom</button>

    <p id="total"></p>

    <button onclick="finalizarPedido()">Finalizar Pedido</button>
    <button onclick="limparTodos()">🗑️ Limpar todos os favoritos</button>
  </aside>
  <!-- Busca (coloque antes do cardápio) -->
<input type="text" id="busca" placeholder="Buscar produto..." oninput="filtrarProdutos(this.value)">

<!-- ... cardápio ... -->


<!-- Botão limpar carrinho (ao lado do carrinho) -->
<button onclick="limparCarrinho()">🗑️ Limpar Carrinho</button>
<div id="mensagemSistema" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #333;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  display: none;
  z-index: 9999;
">
</div>
</body>
</html>
