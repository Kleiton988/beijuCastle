<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Home - BeijúCastle 🫓</title>
  <link rel="stylesheet" href="home.css">
  <script type="module" src="firebase.js"></script>
  <script type="module" src="home.js" defer></script>
</head>
<body class="home">
  <header class="topo">
    <h1>BeijúCastle 🫓</h1>
    <div class="header-right">
      <span id="contadorCarrinho" class="badge">0</span> 🛒
      <p id="userEmail"></p>
      <button id="logout">Sair</button>
      <button onclick="irPerfil()">Perfil</button>
      <button id="btnAdmin" style="display:none;" onclick="irAdmin()">Admin</button>
    </div>
  </header>

  <div class="categorias">
    <button class="cat-btn ativo" data-categoria="todos">Todos</button>
    <button class="cat-btn" data-categoria="tradicional">Tradicional</button>
    <button class="cat-btn" data-categoria="recheado">Recheado</button>
    <button class="cat-btn" data-categoria="doce">Doce</button>
    <button class="cat-btn" data-categoria="especial">Especial</button>
  </div>

  <div class="busca-container">
    <div class="busca-wrapper">
      <input type="text" id="busca" placeholder="🔍 Buscar produto..." oninput="aplicarFiltros()">
      <div id="sugestoesBusca" class="sugestoes"></div>
    </div>
  </div>

  <div class="conteudo-principal">
    <main class="cardapio" id="cardapioContainer"></main>

    <aside class="carrinho">
      <h2>⭐ Favoritos</h2>
      <div id="favoritos"></div>
      <button onclick="limparTodos()">🗑️ Limpar todos os favoritos</button>

      <h2>🛒 Carrinho</h2>
      <div id="listaCarrinho"></div>
      <button onclick="limparCarrinho()">🗑️ Limpar Carrinho</button>

      <div class="opcoes-frete">
        <label><input type="radio" name="frete" value="retirada" onchange="alternarFrete('retirada')"> Retirar na loja (grátis)</label>
        <label><input type="radio" name="frete" value="entrega" onchange="alternarFrete('entrega')" checked> Entrega (+ R$ 5,00)</label>
      </div>

      <input type="text" id="cupom" placeholder="Cupom (ex: BEIJU10)">
      <button onclick="aplicarCupom()">Aplicar Cupom</button>
      <button onclick="removerCupom()">Remover Cupom</button>

      <p id="total"></p>
      <button onclick="finalizarPedido()">Finalizar Pedido</button>
    </aside>
  </div>

  <!-- Modal de Pagamento -->
  <div id="modalPagamento" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:2000;">
    <div style="background:white; padding:30px; border-radius:20px; text-align:center;">
      <h2>Forma de Pagamento</h2>
      <p id="modalTotal"></p>
      <button onclick="confirmarPagamento('Dinheiro')">💵 Dinheiro</button>
      <button onclick="confirmarPagamento('Cartão')">💳 Cartão</button>
      <button onclick="confirmarPagamento('Pix')">📱 Pix</button>
      <br><br>
      <button onclick="cancelarPagamento()">Cancelar</button>
    </div>
  </div>

  <div id="mensagemSistema"></div>
</body>
</html>
